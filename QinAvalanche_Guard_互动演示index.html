        &lt;span&gt;&lt;i class=&quot;qaf-swatch qaf-two&quot;&gt;&lt;/i&gt;2&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;qaf-swatch qaf-three&quot;&gt;&lt;/i&gt;3 临界&lt;/span&gt;
        &lt;span&gt;&lt;i class=&quot;qaf-swatch qaf-active&quot;&gt;&lt;/i&gt;本波松弛&lt;/span&gt;
      &lt;/div&gt;

      &lt;div&gt;
        &lt;div class=&quot;qaf-section-title&quot;&gt;&lt;span&gt;最近 40 次雪崩&lt;/span&gt;&lt;small id=&quot;qaf-memory&quot;&gt;视觉样本 0 / 8&lt;/small&gt;&lt;/div&gt;
        &lt;canvas id=&quot;qaf-history&quot; role=&quot;img&quot; aria-label=&quot;最近四十次雪崩规模的对数柱状图&quot;&gt;&lt;/canvas&gt;
      &lt;/div&gt;

      &lt;div&gt;
        &lt;div class=&quot;qaf-section-title&quot;&gt;&lt;span&gt;计算进度&lt;/span&gt;&lt;small id=&quot;qaf-progress-label&quot;&gt;空闲&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;qaf-progress&quot; aria-hidden=&quot;true&quot;&gt;&lt;i id=&quot;qaf-progress-bar&quot;&gt;&lt;/i&gt;&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;qaf-evidence&quot;&gt;
        &lt;div&gt;&lt;b&gt;状态哈希&lt;/b&gt; &lt;span id=&quot;qaf-state-hash&quot;&gt;生成中…&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;事件哈希&lt;/b&gt; &lt;span id=&quot;qaf-event-hash&quot;&gt;尚无事件&lt;/span&gt;&lt;/div&gt;
        &lt;div&gt;&lt;b&gt;语义&lt;/b&gt; &lt;span id=&quot;qaf-semantics&quot;&gt;精确整数演化；无浮点动力学&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
    &lt;/aside&gt;
  &lt;/section&gt;

  &lt;p class=&quot;qaf-foot&quot;&gt;科学边界：精确反事实视图逐一真实模拟全部可能落点；AI 视觉基线仅以历史事件作近邻估计，必须通过盲测后才能被称为预测器。此演示不把沙堆模型未经验证地外推为真实材料、地质或金融系统的结论。&lt;/p&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;qin-avalanche-flash&#x27;);
      if (!root) return;
      const $ = (s) =&gt; root.querySelector(s);
      const $$ = (s) =&gt; Array.from(root.querySelectorAll(s));
      const gridCanvas = $(&#x27;#qaf-grid&#x27;);
      const historyCanvas = $(&#x27;#qaf-history&#x27;);
      const seedInput = $(&#x27;#qaf-seed&#x27;);
      const sizeSelect = $(&#x27;#qaf-size&#x27;);
      const speedInput = $(&#x27;#qaf-speed&#x27;);
      const dropButton = $(&#x27;#qaf-drop&#x27;);
      const autoButton = $(&#x27;#qaf-auto&#x27;);
      const scanButton = $(&#x27;#qaf-scan&#x27;);
      const replayButton = $(&#x27;#qaf-replay&#x27;);
      const exportButton = $(&#x27;#qaf-export&#x27;);
      const resetButton = $(&#x27;#qaf-reset&#x27;);
      const modeTitle = $(&#x27;#qaf-mode-title&#x27;);
      const modeCopy = $(&#x27;#qaf-mode-copy&#x27;);
      const statusText = $(&#x27;#qaf-status-text&#x27;);
      const progressLabel = $(&#x27;#qaf-progress-label&#x27;);
      const progressBar = $(&#x27;#qaf-progress-bar&#x27;);
      const coordinate = $(&#x27;#qaf-coordinate&#x27;);
      const frameLabel = $(&#x27;#qaf-frame&#x27;);
      const stateHash = $(&#x27;#qaf-state-hash&#x27;);
      const eventHash = $(&#x27;#qaf-event-hash&#x27;);
      const semantics = $(&#x27;#qaf-semantics&#x27;);
      const memoryLabel = $(&#x27;#qaf-memory&#x27;);

      let n = 36;
      let state = new Uint8Array(n * n);
      let selected = 18 * n + 18;
      let rng = mulberry32(20260809);
      let currentView = &#x27;state&#x27;;
      let activeCells = new Set();
      let exactRisk = null;
      let visionRisk = null;
      let history = [];
      let samples = [];
      let lastEvent = null;
      let busy = false;
      let autoRunning = false;
      let scanToken = 0;

      const viewText = {
        state: [&#x27;整数状态 · 唯一事实源&#x27;, &#x27;黑、绿、紫、黄分别映射高度 0、1、2、3；白色闪烁表示本波发生松弛的格点。点击任意格点改变下一次落点。&#x27;],
        counterfactual: [&#x27;精确反事实 · 逐落点穷举&#x27;, &#x27;对当前状态的每一个可能落点都真实运行一次整数松弛；颜色越强，若下一粒落在那里，雪崩规模越大。这是模拟结果，不是机器学习猜测。&#x27;],
        vision: [&#x27;AI 视觉基线 · 可检验近似&#x27;, &#x27;把全局临界占比、局部颜色纹理、落点高度与边界距离作为视觉—状态特征，从历史事件做近邻估计。样本不足或未盲测时不宣称预测能力。&#x27;],
        evidence: [&#x27;QinEvidence · 状态—动作—结果绑定&#x27;, &#x27;种子、格点整数、所选落点、规则版本、雪崩统计和最终状态均进入规范化哈希；同一输入可独立复演并核验结果。&#x27;]
      };

      function mulberry32(seed) {
        let a = seed &gt;&gt;&gt; 0;
        return () =&gt; {
          a |= 0;
          a = a + 0x6D2B79F5 | 0;
          let t = Math.imul(a ^ a &gt;&gt;&gt; 15, 1 | a);
          t = t + Math.imul(t ^ t &gt;&gt;&gt; 7, 61 | t) ^ t;
          return ((t ^ t &gt;&gt;&gt; 14) &gt;&gt;&gt; 0) / 4294967296;
        };
      }

      function sha256(ascii) {
        const rightRotate = (value, amount) =&gt; (value &gt;&gt;&gt; amount) | (value &lt;&lt; (32 - amount));
        const maxWord = Math.pow(2, 32);
        let result = &#x27;&#x27;;
        const words = [];
        const asciiBitLength = ascii.length * 8;
        let hash = sha256.h = sha256.h || [];
        const k = sha256.k = sha256.k || [];
        let primeCounter = k.length;
        const isComposite = {};
        for (let candidate = 2; primeCounter &lt; 64; candidate++) {
          if (!isComposite[candidate]) {
            for (let i = 0; i &lt; 313; i += candidate) isComposite[i] = candidate;
            hash[primeCounter] = (Math.pow(candidate, .5) * maxWord) | 0;
            k[primeCounter++] = (Math.pow(candidate, 1 / 3) * maxWord) | 0;
          }
        }
        ascii += &#x27;\x80&#x27;;
        while (ascii.length % 64 - 56) ascii += &#x27;\x00&#x27;;
        for (let i = 0; i &lt; ascii.length; i++) {
          const j = ascii.charCodeAt(i);
          if (j &gt;&gt; 8) return &#x27;&#x27;;
          words[i &gt;&gt; 2] |= j &lt;&lt; ((3 - i) % 4) * 8;
        }
        words[words.length] = (asciiBitLength / maxWord) | 0;
        words[words.length] = asciiBitLength;
        for (let j = 0; j &lt; words.length;) {
          const w = words.slice(j, j += 16);
          const oldHash = hash.slice(0);
          hash = hash.slice(0, 8);
          for (let i = 0; i &lt; 64; i++) {
            const w15 = w[i - 15], w2 = w[i - 2];
            const a = hash[0], e = hash[4];
            const temp1 = hash[7]
              + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25))
              + ((e &amp; hash[5]) ^ ((~e) &amp; hash[6])) + k[i]
              + (w[i] = i &lt; 16 ? w[i] : (w[i - 16]
                + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 &gt;&gt;&gt; 3))
                + w[i - 7]
                + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 &gt;&gt;&gt; 10))) | 0);
            const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22))
              + ((a &amp; hash[1]) ^ (a &amp; hash[2]) ^ (hash[1] &amp; hash[2]));
            hash = [(temp1 + temp2) | 0].concat(hash);
            hash[4] = (hash[4] + temp1) | 0;
            hash.pop();
          }
          for (let i = 0; i &lt; 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
        }
        for (let i = 0; i &lt; 8; i++) {
          for (let j = 3; j + 1; j--) {
            const b = (hash[i] &gt;&gt; (j * 8)) &amp; 255;
            result += (b &lt; 16 ? &#x27;0&#x27; : &#x27;&#x27;) + b.toString(16);
          }
        }
        return result;
      }

      const colorProbe = document.createElement(&#x27;span&#x27;);
      colorProbe.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
      colorProbe.style.cssText = &#x27;position:absolute;visibility:hidden;pointer-events:none&#x27;;
      root.appendChild(colorProbe);
      function canonicalState(arr) { return Array.from(arr).join(&#x27;&#x27;); }
      function shortHash(text) { const h = sha256(text); return h.slice(0, 12) + &#x27;…&#x27; + h.slice(-8); }
      function color(name) {
        colorProbe.style.color = `var(${name})`;
        return getComputedStyle(colorProbe).color;
      }

      function initialize() {
        scanToken++;
        autoRunning = false;
        autoButton.textContent = &#x27;自动实验&#x27;;
        busy = false;
        n = Number(sizeSelect.value);
        const seed = (Number(seedInput.value) || 1) &gt;&gt;&gt; 0;
        rng = mulberry32(seed);
        state = new Uint8Array(n * n);
        for (let i = 0; i &lt; state.length; i++) {
          const p = rng();
          state[i] = p &lt; .08 ? 0 : p &lt; .22 ? 1 : p &lt; .50 ? 2 : 3;
        }
        selected = Math.floor(n / 2) * n + Math.floor(n / 2);
        exactRisk = null;
        visionRisk = null;
        history = [];
        samples = [];
        lastEvent = null;
        activeCells.clear();
        setStats(0, 0, 0);
        replayButton.disabled = true;
        exportButton.disabled = true;
        statusText.textContent = &#x27;系统已由种子确定性初始化；等待下一次落沙。&#x27;;
        progressLabel.textContent = &#x27;空闲&#x27;;
        progressBar.style.width = &#x27;0%&#x27;;
        frameLabel.textContent = &#x27;稳定态&#x27;;
        updateCoordinate();
        updateStateHash();
        updateMemory();
        setView(&#x27;state&#x27;);
        setControls(false);
        draw();
        drawHistory();
      }

      function simulate(input, dropIndex, capture) {
        const grid = new Int32Array(input);
        const area = new Set();
        const frames = [];
        let size = 0;
        let loss = 0;
        let waves = 0;
        grid[dropIndex]++;
        let unstable = grid[dropIndex] &gt;= 4 ? [dropIndex] : [];
        while (unstable.length) {
          waves++;
          const active = unstable.slice();
          const nextCandidates = new Set();
          for (const idx of active) {
            if (grid[idx] &lt; 4) continue;
            grid[idx] -= 4;
            size++;
            area.add(idx);
            const row = Math.floor(idx / n);
            const col = idx % n;
            if (row &gt; 0) { grid[idx - n]++; nextCandidates.add(idx - n); } else loss++;
            if (row &lt; n - 1) { grid[idx + n]++; nextCandidates.add(idx + n); } else loss++;
            if (col &gt; 0) { grid[idx - 1]++; nextCandidates.add(idx - 1); } else loss++;
            if (col &lt; n - 1) { grid[idx + 1]++; nextCandidates.add(idx + 1); } else loss++;
            if (grid[idx] &gt;= 4) nextCandidates.add(idx);
          }
          unstable = Array.from(nextCandidates).filter(i =&gt; grid[i] &gt;= 4).sort((a, b) =&gt; a - b);
          if (capture &amp;&amp; frames.length &lt; 72) {
            frames.push({ state: Uint8Array.from(grid, v =&gt; v &amp; 255), active });
          }
        }
        const final = Uint8Array.from(grid, v =&gt; v &amp; 255);
        if (capture &amp;&amp; (!frames.length || frames[frames.length - 1].state.some((v, i) =&gt; v !== final[i]))) {
          frames.push({ state: final.slice(), active: [] });
        }
        return { final, size, area: area.size, loss, waves, frames };
      }

      function features(grid, idx) {
        let critical = 0;
        let mass = 0;
        for (let i = 0; i &lt; grid.length; i++) {
          mass += grid[i];
          if (grid[i] === 3) critical++;
        }
        const row = Math.floor(idx / n);
        const col = idx % n;
        let localCritical = 0;
        let localMass = 0;
        let localCount = 0;
        for (let dr = -2; dr &lt;= 2; dr++) {
          for (let dc = -2; dc &lt;= 2; dc++) {
            const rr = row + dr, cc = col + dc;
            if (rr &lt; 0 || rr &gt;= n || cc &lt; 0 || cc &gt;= n) continue;
            const v = grid[rr * n + cc];
            localMass += v;
            localCritical += v === 3 ? 1 : 0;
            localCount++;
          }
        }
        const edge = Math.min(row, col, n - 1 - row, n - 1 - col) / Math.max(1, n / 2);
        return [critical / grid.length, mass / (3 * grid.length), localCritical / localCount, localMass / (3 * localCount), grid[idx] / 3, edge];
      }

      function predictVision() {
        const out = new Float64Array(state.length);
        if (samples.length &lt; 8) return out;
        for (let idx = 0; idx &lt; state.length; idx++) {
          const f = features(state, idx);
          const ranked = samples.map(s =&gt; {
            let d = 0;
            for (let j = 0; j &lt; f.length; j++) {
              const delta = f[j] - s.features[j];
              d += delta * delta;
            }
            return { d: Math.sqrt(d), y: s.target };
          }).sort((a, b) =&gt; a.d - b.d).slice(0, Math.min(7, samples.length));
          let numerator = 0, denominator = 0;
          for (const item of ranked) {
            const w = 1 / (item.d + .015);
            numerator += w * item.y;
            denominator += w;
          }
          out[idx] = Math.expm1(numerator / denominator);
        }
        return out;
      }

      function startDrop(replay) {
        if (busy) return;
        if (replay &amp;&amp; !lastEvent) return;
        busy = true;
        setControls(true);
        exactRisk = null;
        visionRisk = null;
        const pre = replay ? lastEvent.pre.slice() : state.slice();
        const idx = replay ? lastEvent.dropIndex : selected;
        if (replay) state = pre.slice();
        const preFeature = features(pre, idx);
        const result = simulate(pre, idx, true);
        let frame = 0;
        const delay = Math.max(12, 150 - Number(speedInput.value) * 14);
        statusText.textContent = replay ? &#x27;正在以完全相同的状态和落点复演末次事件…&#x27; : &#x27;整数松弛正在传播；白色格点表示当前波次。&#x27;;
        frameLabel.textContent = result.frames.length ? `波 1 / ${result.waves}` : &#x27;无松弛&#x27;;

        const advance = () =&gt; {
          if (frame &lt; result.frames.length) {
            state = result.frames[frame].state.slice();
            activeCells = new Set(result.frames[frame].active);
            frameLabel.textContent = result.waves ? `波 ${Math.min(frame + 1, result.waves)} / ${result.waves}` : &#x27;无松弛&#x27;;
            draw();
            frame++;
            window.setTimeout(advance, delay);
            return;
          }
          state = result.final.slice();
          activeCells.clear();
          selected = idx;
          const seed = (Number(seedInput.value) || 1) &gt;&gt;&gt; 0;
          const eventNumber = replay &amp;&amp; lastEvent ? lastEvent.eventNumber : history.length + 1;
          const beforeHash = sha256(`QIN-STATE-v1|${n}|${canonicalState(pre)}`);
          const afterHash = sha256(`QIN-STATE-v1|${n}|${canonicalState(state)}`);
          const eventCanonical = `QIN-EVENT-v1|BTW-open-boundary|${n}|${seed}|${eventNumber}|${idx}|${beforeHash}|${result.size}|${result.area}|${result.loss}|${result.waves}|${afterHash}`;
          const hash = sha256(eventCanonical);
          const evidence = {
            schema: &#x27;urn:qinevidence:avalanche:1&#x27;,
            schema_version: &#x27;1.0.0&#x27;,
            engine: { name: &#x27;QinAvalanche Guard&#x27;, version: &#x27;1.0.0&#x27;, rule: &#x27;BTW-2D-open-boundary-integer-v1&#x27; },
            reproducibility: { seed, lattice_size: n, state_before_sha256: beforeHash, state_after_sha256: afterHash },
            action: { type: &#x27;add_grain&#x27;, index: idx, row: Math.floor(idx / n), column: idx % n },
            result: { topplings: result.size, affected_cells: result.area, boundary_loss: result.loss, relaxation_waves: result.waves },
            event_sha256: hash,
            scientific_scope: &#x27;Exact discrete replay and counterfactual simulation; no claim of real-world transfer.&#x27;
          };

          if (!replay) {
            history.push(result.size);
            if (history.length &gt; 40) history.shift();
            samples.push({ features: preFeature, target: Math.log1p(result.size) });
            if (samples.length &gt; 240) samples.shift();
          }
          const replayMatch = replay &amp;&amp; lastEvent ? hash === lastEvent.evidence.event_sha256 : null;
          lastEvent = replay ? lastEvent : { pre, dropIndex: idx, eventNumber, result, evidence };
          setStats(result.size, result.area, result.loss);
          eventHash.textContent = shortHash(hash);
          exportButton.disabled = false;
          replayButton.disabled = false;
          statusText.textContent = replay
            ? (replayMatch ? &#x27;复演一致：状态、动作、统计量与事件哈希完全相同。&#x27; : &#x27;复演不一致：请导出证据并检查环境。&#x27;)
            : (result.size ? `事件完成：${result.waves} 个松弛波，结果已绑定证据哈希。` : &#x27;这一粒没有触发松弛；零事件同样被完整记录。&#x27;);
          frameLabel.textContent = &#x27;稳定态&#x27;;
          busy = false;
          setControls(false);
          updateCoordinate();
          updateStateHash();
          updateMemory();
          draw();
          drawHistory();
          if (autoRunning) {
            selected = Math.floor(rng() * state.length);
            updateCoordinate();
            window.setTimeout(() =&gt; startDrop(false), 220);
          }
        };
        advance();
      }

      function startScan() {
        if (busy) return;
        busy = true;
        autoRunning = false;
        autoButton.textContent = &#x27;自动实验&#x27;;
        setControls(true);
        const token = ++scanToken;
        const snapshot = state.slice();
        const risk = new Float64Array(state.length);
        let idx = 0;
        currentView = &#x27;counterfactual&#x27;;
        updateViewButtons();
        updateViewText();
        statusText.textContent = &#x27;正在对每一个可能落点运行完整整数松弛…&#x27;;
        progressLabel.textContent = `0 / ${state.length}`;
        progressBar.style.width = &#x27;0%&#x27;;

        const chunk = () =&gt; {
          if (token !== scanToken) return;
          const started = performance.now();
          while (idx &lt; snapshot.length &amp;&amp; performance.now() - started &lt; 13) {
            risk[idx] = simulate(snapshot, idx, false).size;
            idx++;
          }
          const percent = idx / snapshot.length * 100;
          progressBar.style.width = `${percent}%`;
          progressLabel.textContent = `${idx} / ${snapshot.length}`;
          if (idx &lt; snapshot.length) {
            requestAnimationFrame(chunk);
            return;
          }
          exactRisk = risk;
          let max = 0, maxIndex = 0, triggering = 0;
          for (let i = 0; i &lt; risk.length; i++) {
            if (risk[i] &gt; 0) triggering++;
            if (risk[i] &gt; max) { max = risk[i]; maxIndex = i; }
          }
          selected = maxIndex;
          busy = false;
          setControls(false);
          progressLabel.textContent = &#x27;全域穷举完成&#x27;;
          statusText.textContent = `已精确计算 ${risk.length} 个落点：${triggering} 个会触发松弛；最大规模 ${Math.round(max)}。已选中最危险落点。`;
          updateCoordinate();
          draw();
        };
        requestAnimationFrame(chunk);
      }

      function setView(view) {
        currentView = view;
        updateViewButtons();
        updateViewText();
        if (view === &#x27;counterfactual&#x27; &amp;&amp; !exactRisk &amp;&amp; !busy) {
          statusText.textContent = &#x27;尚未计算本状态的全域反事实；点击“全域反事实”开始逐落点精确模拟。&#x27;;
        }
        if (view === &#x27;vision&#x27;) {
          visionRisk = predictVision();
          statusText.textContent = samples.length &lt; 8
            ? `视觉基线需要至少 8 个本地事件；当前只有 ${samples.length} 个。先运行自动实验积累样本。`
            : `已用 ${samples.length} 个历史事件生成近邻风险估计；它是待盲测的诊断基线，不是证明。`;
        }
        if (view === &#x27;evidence&#x27;) {
          statusText.textContent = lastEvent ? &#x27;末次事件已形成可导出的 QinEvidence JSON；可用相同初态和动作独立复演。&#x27; : &#x27;运行一次事件后将生成状态哈希、动作、结果和事件哈希。&#x27;;
        }
        draw();
      }

      function updateViewButtons() {
        $$(&#x27;[data-view]&#x27;).forEach(button =&gt; button.setAttribute(&#x27;aria-pressed&#x27;, String(button.dataset.view === currentView)));
      }
      function updateViewText() {
        modeTitle.textContent = viewText[currentView][0];
        modeCopy.textContent = viewText[currentView][1];
        semantics.textContent = currentView === &#x27;vision&#x27; ? &#x27;近邻估计；必须盲测；非证明&#x27; : currentView === &#x27;counterfactual&#x27; ? &#x27;逐落点真实模拟；精确反事实&#x27; : currentView === &#x27;evidence&#x27; ? &#x27;规范化输入—输出哈希绑定&#x27; : &#x27;精确整数演化；无浮点动力学&#x27;;
      }
      function setStats(size, area, loss) {
        $(&#x27;#qaf-size-stat&#x27;).textContent = Number(size).toLocaleString(&#x27;zh-CN&#x27;);
        $(&#x27;#qaf-area-stat&#x27;).textContent = Number(area).toLocaleString(&#x27;zh-CN&#x27;);
        $(&#x27;#qaf-loss-stat&#x27;).textContent = Number(loss).toLocaleString(&#x27;zh-CN&#x27;);
      }
      function setControls(working) {
        dropButton.disabled = working;
        scanButton.disabled = working;
        resetButton.disabled = working;
        sizeSelect.disabled = working;
        seedInput.disabled = working;
        replayButton.disabled = working || !lastEvent;
        exportButton.disabled = working || !lastEvent;
      }
      function updateCoordinate() {
        coordinate.textContent = `选中 (${Math.floor(selected / n)}, ${selected % n}) · 高度 ${state[selected]}`;
      }
      function updateMemory() {
        memoryLabel.textContent = samples.length &gt;= 8 ? `视觉样本 ${samples.length} · 可诊断` : `视觉样本 ${samples.length} / 8`;
      }
      function updateStateHash() {
        stateHash.textContent = shortHash(`QIN-STATE-v1|${n}|${canonicalState(state)}`);
      }

      function draw() {
        const rect = gridCanvas.getBoundingClientRect();
        if (!rect.width) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const side = Math.max(260, rect.width);
        const px = Math.floor(side * dpr);
        if (gridCanvas.width !== px || gridCanvas.height !== px) {
          gridCanvas.width = px;
          gridCanvas.height = px;
        }
        const ctx = gridCanvas.getContext(&#x27;2d&#x27;);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, side, side);
        const cell = side / n;
        const palette = [color(&#x27;--qaf-zero&#x27;), color(&#x27;--qaf-one&#x27;), color(&#x27;--qaf-two&#x27;), color(&#x27;--qaf-three&#x27;)];

        if (currentView === &#x27;counterfactual&#x27; &amp;&amp; exactRisk) {
          drawRisk(ctx, exactRisk, side, cell, color(&#x27;--background&#x27;), color(&#x27;--viz-series-1&#x27;));
        } else if (currentView === &#x27;vision&#x27; &amp;&amp; samples.length &gt;= 8) {
          if (!visionRisk) visionRisk = predictVision();
          drawRisk(ctx, visionRisk, side, cell, color(&#x27;--background&#x27;), color(&#x27;--primary&#x27;));
        } else {
          for (let i = 0; i &lt; state.length; i++) {
            ctx.fillStyle = activeCells.has(i) ? color(&#x27;--qaf-active&#x27;) : palette[Math.min(3, state[i])];
            const row = Math.floor(i / n), col = i % n;
            ctx.fillRect(col * cell, row * cell, Math.ceil(cell + .2), Math.ceil(cell + .2));
          }
        }

        const row = Math.floor(selected / n), col = selected % n;
        ctx.strokeStyle = color(&#x27;--primary&#x27;);
        ctx.lineWidth = Math.max(2, Math.min(4, cell * .28));
        ctx.strokeRect(col * cell + ctx.lineWidth / 2, row * cell + ctx.lineWidth / 2, cell - ctx.lineWidth, cell - ctx.lineWidth);
        gridCanvas.setAttribute(&#x27;aria-label&#x27;, `${n}乘${n}沙堆格点；当前选中第${row}行第${col}列，高度${state[selected]}；视图${modeTitle.textContent}`);
      }

      function drawRisk(ctx, values, side, cell, base, accent) {
        let maxLog = 0;
        for (let i = 0; i &lt; values.length; i++) maxLog = Math.max(maxLog, Math.log1p(values[i]));
        ctx.fillStyle = base;
        ctx.fillRect(0, 0, side, side);
        for (let i = 0; i &lt; values.length; i++) {
          const row = Math.floor(i / n), col = i % n;
          const t = maxLog ? Math.log1p(values[i]) / maxLog : 0;
          ctx.globalAlpha = .08 + .92 * t;
          ctx.fillStyle = accent;
          ctx.fillRect(col * cell, row * cell, Math.ceil(cell + .2), Math.ceil(cell + .2));
        }
        ctx.globalAlpha = 1;
      }

      function drawHistory() {
        const rect = historyCanvas.getBoundingClientRect();
        if (!rect.width) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = rect.width, height = 115;
        historyCanvas.width = Math.floor(width * dpr);
        historyCanvas.height = Math.floor(height * dpr);
        const ctx = historyCanvas.getContext(&#x27;2d&#x27;);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, width, height);
        ctx.strokeStyle = color(&#x27;--border&#x27;);
        ctx.lineWidth = 1;
        for (let y = 1; y &lt;= 3; y++) {
          ctx.beginPath();
          ctx.moveTo(0, y * height / 4);
          ctx.lineTo(width, y * height / 4);
          ctx.stroke();
        }
        if (!history.length) return;
        const logs = history.map(v =&gt; Math.log1p(v));
        const max = Math.max(1, ...logs);
        const gap = 2;
        const bar = Math.max(2, width / 40 - gap);
        const start = width - history.length * (bar + gap);
        ctx.fillStyle = color(&#x27;--primary&#x27;);
        logs.forEach((v, i) =&gt; {
          const h = v / max * (height - 9);
          ctx.fillRect(start + i * (bar + gap), height - h, bar, h);
        });
      }

      function exportEvidence() {
        if (!lastEvent) return;
        const data = JSON.stringify(lastEvent.evidence, null, 2);
        const blob = new Blob([data], { type: &#x27;application/json;charset=utf-8&#x27; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&#x27;a&#x27;);
        link.href = url;
        link.download = `QinEvidence_Avalanche_Event_${lastEvent.eventNumber}.json`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      gridCanvas.addEventListener(&#x27;click&#x27;, (event) =&gt; {
        if (busy) return;
        const rect = gridCanvas.getBoundingClientRect();
        const col = Math.max(0, Math.min(n - 1, Math.floor((event.clientX - rect.left) / rect.width * n)));
        const row = Math.max(0, Math.min(n - 1, Math.floor((event.clientY - rect.top) / rect.height * n)));
        selected = row * n + col;
        updateCoordinate();
        draw();
      });
      dropButton.addEventListener(&#x27;click&#x27;, () =&gt; startDrop(false));
      autoButton.addEventListener(&#x27;click&#x27;, () =&gt; {
        autoRunning = !autoRunning;
        autoButton.textContent = autoRunning ? &#x27;停止自动&#x27; : &#x27;自动实验&#x27;;
        if (autoRunning &amp;&amp; !busy) {
          selected = Math.floor(rng() * state.length);
          updateCoordinate();
          startDrop(false);
        }
      });
      scanButton.addEventListener(&#x27;click&#x27;, startScan);
      replayButton.addEventListener(&#x27;click&#x27;, () =&gt; startDrop(true));
      exportButton.addEventListener(&#x27;click&#x27;, exportEvidence);
      resetButton.addEventListener(&#x27;click&#x27;, initialize);
      sizeSelect.addEventListener(&#x27;change&#x27;, initialize);
      seedInput.addEventListener(&#x27;change&#x27;, initialize);
      $$(&#x27;[data-view]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; setView(button.dataset.view)));

      const observer = new ResizeObserver(() =&gt; { draw(); drawHistory(); });
      observer.observe(root);
      requestAnimationFrame(initialize);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;

(() =&gt; {
